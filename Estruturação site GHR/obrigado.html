<style>
:root {
  --verde: #33CC66;
  --verde-escuro: #0B3D1A;
  --menta-clara: #F4F8F4;
  --escuro: #1D2939;
  --preto: #000000;
  --branco: #FFFFFF;
  --borda: #D5E5DC;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: var(--menta-clara); color: var(--escuro);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
header { border-bottom: 1px solid var(--borda); padding: 14px 24px; }
.logo {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 900; font-size: 18px; letter-spacing: -0.5px;
  text-decoration: none; color: var(--escuro);
}
.logo-diamond { color: var(--verde); }
main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
}
.caixa {
  max-width: 560px; width: 100%; background: var(--branco);
  border: 1px solid var(--borda); padding: 48px 36px; text-align: center;
}
.check {
  width: 56px; height: 56px; margin: 0 auto 20px;
  border: 3px solid var(--verde); color: var(--verde);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 900;
}
.tag { font-family: var(--mono); font-size: 12px; color: var(--verde); letter-spacing: 2px; margin-bottom: 10px; }
h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1.15; margin-bottom: 14px; }
h1 span { color: var(--verde); }
p { color: #5A6B7A; font-size: 16px; margin-bottom: 28px; }
.acoes { display: flex; flex-direction: column; gap: 12px; }
.btn {
  display: block; padding: 16px 24px; font-weight: 800; font-size: 15px;
  text-decoration: none; transition: background 0.15s;
}
.btn-primary { background: var(--verde); color: var(--preto); }
.btn-primary:hover { background: #2AB857; }
.btn-secondary { border: 2px solid var(--escuro); color: var(--escuro); }
.btn-secondary:hover { background: var(--escuro); color: var(--branco); }
a:focus-visible { outline: 3px solid var(--verde); outline-offset: 3px; }
</style>
